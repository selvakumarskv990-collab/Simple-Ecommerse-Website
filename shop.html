<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - MyShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">MyShop</a>
      <div class="ms-auto d-flex align-items-center">
        <span class="text-white me-3" id="welcomeUser"></span>
        <button class="btn btn-outline-light me-2" id="cartBtn">🛒 Cart (<span id="cart-count">0</span>)</button>
        <button class="btn btn-danger" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Product Section -->
  <div class="container my-5">
    <h2 class="text-center mb-4">Our Products</h2>
    <div class="row" id="product-list"></div>
  </div>

  <!-- Cart Modal -->
  <div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Your Cart</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cart-items"><p>Your cart is empty.</p></div>
        <div class="modal-footer">
          <h5 class="me-auto">Total: $<span id="cart-total">0</span></h5>
          <button class="btn btn-success" id="checkoutBtn">Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
